[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "smoothcontext"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "numpy>=2.0,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
